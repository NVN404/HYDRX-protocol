services:
  - type: web
    name: hydrx-relayer
    env: node
    plan: free
    rootDir: relayer
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NETWORK
        value: devnet
      - key: BASE_RPC_URL
        value: https://rpc.magicblock.app/devnet
      - key: ROUTER_URL
        value: https://devnet-router.magicblock.app/
      - key: EPHEMERAL_RPC_URL
        value: https://devnet-as.magicblock.app/
      - key: PROGRAM_ID
        value: 8dLu65pPh6AbfDmRW5GUGqjPQuxihnpv2vWydzt98vKj
      - key: RELAYER_KEYPAIR
        sync: false
