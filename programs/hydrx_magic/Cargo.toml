[package]
name = "hydrx-magic"
version = "0.1.0"
description = "HydrX Protocol on MagicBlock Ephemeral Rollups: Sub-50ms Water Conservation DePIN"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "hydrx_magic"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["mint", "token"] }
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor-compat"] }
solana-program = "2.2.0"
