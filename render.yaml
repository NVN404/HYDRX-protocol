# Render Blueprint Specification
# Deploys both HydrX Relayer and HydrX Frontend under one unified Render project
services:
  # ============================================================================
  # 1. HydrX Relayer Proxy (MagicBlock ER Bridge)
  # ============================================================================
  - type: web
    name: hydrx-relayer
    env: node
    plan: free
    rootDir: relayer
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NETWORK
        value: devnet
      - key: BASE_RPC_URL
        value: https://rpc.magicblock.app/devnet
      - key: ROUTER_URL
        value: https://devnet-router.magicblock.app/
      - key: EPHEMERAL_RPC_URL
        value: https://devnet-as.magicblock.app/
      - key: PROGRAM_ID
        value: 8dLu65pPh6AbfDmRW5GUGqjPQuxihnpv2vWydzt98vKj
      - key: RELAYER_KEYPAIR
        sync: false

  # ============================================================================
  # 2. HydrX Next.js Frontend Application
  # ============================================================================
  - type: web
    name: hydrx-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_SOLANA_RPC_URL
        value: https://rpc.magicblock.app/devnet
      - key: NEXT_PUBLIC_ROUTER_URL
        value: https://devnet-router.magicblock.app/
      - key: NEXT_PUBLIC_EPHEMERAL_RPC_URL
        value: https://devnet-as.magicblock.app/
      - key: NEXT_PUBLIC_PROGRAM_ID
        value: 8dLu65pPh6AbfDmRW5GUGqjPQuxihnpv2vWydzt98vKj
      - key: NEXT_PUBLIC_RELAYER_URL
        fromService:
          type: web
          name: hydrx-relayer
          property: host
