  <!-- Bottom Technical Engineering Footer -->
  <g transform="translate(120, 960)">
    <line x1="0" y1="0" x2="1680" y2="0" stroke="#27272a" stroke-width="1"/>
    <text x="0" y="30" fill="#71717a" font-family="monospace" font-size="11">NODE CLUSTER // 12.9716° N, 77.5946° E</text>
    <text x="560" y="30" fill="#71717a" font-family="monospace" font-size="11">RELAYER: ZERO-GAS SPONSORED PROXY</text>
    <text x="1120" y="30" fill="#71717a" font-family="monospace" font-size="11">NETWORK: SOLANA DEVNET [CONFIRMED]</text>
    <text x="1680" y="30" fill="#ffffff" font-family="monospace" font-size="11" text-anchor="end">HYDRX.NETWORK</text>
